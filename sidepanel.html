<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg-page: linear-gradient(180deg, #f7f8fb 0%, #f1f4f9 100%);
      --bg-card: #ffffff;
      --bg-muted: #f8fafc;
      --border-color: #e6e8eb;
      --border-strong: #d8dadd;
      --text-color: #1a1f36;
      --text-muted: #697386;
      --text-subtle: #495057;
      --accent-bg: #ececff;
      --accent-border: #d7d6ff;
      --accent-text: #3d38ad;
      --button-bg: #635bff;
      --button-bg-hover: #5851e9;
      --success-text: #14a800;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      min-width: 0;
      min-height: 100vh;
      padding: 16px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg-page);
      color: var(--text-color);
      overflow-y: auto;
    }

    .header {
      margin-bottom: 16px;
      text-align: left;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 700;
      margin: 0 0 6px 0;
      letter-spacing: -0.2px;
    }

    .header p {
      margin: 0;
      font-size: 13px;
      line-height: 1.5;
      color: var(--text-muted);
    }

    .site-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 5px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      margin-bottom: 16px;
      width: 100%;
    }

    .site-tab {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-subtle);
      padding: 9px 14px;
      font-size: 14px;
      border-radius: 9px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
      flex: 1 1 120px;
    }

    .site-tab:hover {
      background: #f8f9fa;
      color: var(--text-color);
      transform: none;
    }

    .site-tab.active {
      background: var(--accent-bg);
      border-color: var(--accent-border);
      color: var(--accent-text);
    }

    #siteContent {
      min-height: 400px;
    }

    .site-tab-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 6px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      margin-bottom: 16px;
      width: 100%;
    }

    .site-tab-btn {
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-subtle);
      padding: 8px 12px;
      font-size: 13px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      flex: 1 1 140px;
    }

    .site-tab-btn:hover {
      transform: none;
      background: #f8f9fa;
      color: var(--text-color);
    }

    .site-tab-btn.active {
      background: var(--accent-bg);
      border-color: var(--accent-border);
      color: var(--accent-text);
    }

    .site-tab-panel {
      display: none;
    }

    .site-tab-panel.active {
      display: block;
    }

    .controls {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 12px;
      margin-bottom: 18px;
      padding: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
    }

    .control-left,
    .control-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .control-right {
      font-size: 13px;
      color: var(--text-subtle);
      font-weight: 600;
      justify-content: space-between;
    }

    .mode-select {
      min-height: 36px;
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      padding: 0 10px;
      background: var(--bg-card);
      color: var(--text-color);
      font-size: 13px;
    }

    button {
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      background: var(--button-bg);
      color: #fff;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: background 0.15s ease, transform 0.15s ease;
      white-space: nowrap;
    }

    button:hover {
      background: var(--button-bg-hover);
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .clear-btn {
      background: transparent;
      color: #6c757d;
      border: 1px solid var(--border-strong);
      font-weight: 500;
    }

    .clear-btn:hover {
      background: #fff;
      color: #dc3545;
      border-color: #dc3545;
      transform: none;
    }

    .auth-warning {
      background: #fff3cd;
      color: #856404;
      border: 1px solid #ffe8a1;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 14px;
      display: none;
    }

    .info-warning {
      background: #e9f5ff;
      color: #0c5460;
      border: 1px solid #b8e1f7;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 14px;
      display: none;
    }

    .data-preview {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      box-shadow: 0 2px 5px rgba(26, 31, 54, 0.05);
      padding: 12px;
    }

    .data-preview-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      padding: 0 2px;
    }

    .data-preview-title {
      font-size: 15px;
      font-weight: 600;
      color: #444;
    }

    .data-preview-title span {
      color: var(--success-text);
    }

    .subtle-note {
      margin: 0 0 10px 2px;
      font-size: 12px;
      color: #6c757d;
      line-height: 1.45;
    }

    .raw-json-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 12px;
      color: #6c757d;
      font-weight: 600;
    }

    .copy-json-btn {
      padding: 6px 10px;
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      background: #fff;
      color: var(--text-subtle);
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }

    .copy-json-btn:hover {
      background: #f8f9fa;
    }

    .toolbar-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .raw-json {
      width: 100%;
      min-height: 260px;
      max-height: 420px;
      resize: vertical;
      border: 1px solid #dfe3e8;
      border-radius: 8px;
      padding: 10px;
      font-family: Consolas, "Courier New", monospace;
      font-size: 12px;
      line-height: 1.45;
      color: #212529;
      background: #fbfcfd;
    }

    .coming-soon {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 320px;
      text-align: center;
      color: var(--text-muted);
    }

    .coming-soon-icon {
      font-size: 56px;
      margin-bottom: 16px;
    }

    .coming-soon h2 {
      font-size: 22px;
      font-weight: 600;
      color: var(--text-color);
      margin: 0 0 8px 0;
    }

    .coming-soon p {
      font-size: 14px;
      margin: 0;
      line-height: 1.5;
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }

    ::-webkit-scrollbar-thumb {
      background: #c8c8c8;
      border-radius: 4px;
    }

    @media (max-width: 520px) {
      body {
        padding: 12px;
      }

      .data-preview-header,
      .raw-json-toolbar {
        flex-direction: column;
        align-items: stretch;
      }

      .toolbar-actions {
        justify-content: flex-start;
      }

      .mode-select {
        width: 100%;
      }

      button,
      .copy-json-btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Data Scraper</h1>
    <p>Persistent side panel for multi-site scraping and navigation.</p>
  </div>

  <div id="siteTabs" class="site-tabs">
    <!-- site tabs are rendered by sidepanel-shell.js -->
  </div>

  <div id="siteContent">
    <!-- site panel HTML is loaded dynamically -->
  </div>

  <script src="sites/upwork/shared/upwork-run-status.js"></script>
  <script src="sites/upwork/panel.js"></script>
  <script src="sites/tiktok/panel.js"></script>
  <script src="sidepanel-shell.js"></script>
</body>
</html>
